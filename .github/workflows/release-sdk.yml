name: Release SDK

# Publishes the metering SDKs on a version tag:
#   git tag sdk-v0.1.0 && git push origin sdk-v0.1.0
#
# PREREQUISITES (one-time, done by a human — see docs/deploy.md):
#   1. Register the names so nobody else can squat them:
#        - PyPI:  project `annapurna-meter`   (https://pypi.org/manage/projects/)
#        - npm:   scope   `@annapurna`        (https://www.npmjs.com/org/create)
#   2. Add repo secrets:
#        - PYPI_API_TOKEN  (PyPI -> Account settings -> API tokens)
#        - NPM_TOKEN       (npm -> Access Tokens -> Automation)
#
# Until those exist this workflow is inert: it only runs on `sdk-v*` tags, and
# publishing is skipped when the corresponding secret is absent — so the build
# and tests still act as a release dry-run.

on:
  push:
    tags: ["sdk-v*"]
  workflow_dispatch: {}

jobs:
  python:
    name: Publish Python SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test (the SDK must never ship broken)
        working-directory: sdk/python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m pytest -q

      - name: Build
        working-directory: sdk/python
        run: |
          pip install --upgrade build twine
          python -m build
          twine check dist/*

      - name: Publish to PyPI
        if: ${{ env.PYPI_API_TOKEN != '' }}
        working-directory: sdk/python
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*

      - name: Skip note
        if: ${{ env.PYPI_API_TOKEN == '' }}
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: echo "PYPI_API_TOKEN not set — built and checked, skipped upload."

  node:
    name: Publish Node SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Test
        working-directory: sdk/node
        run: node --test

      - name: Publish to npm
        if: ${{ env.NPM_TOKEN != '' }}
        working-directory: sdk/node
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      - name: Skip note
        if: ${{ env.NPM_TOKEN == '' }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: echo "NPM_TOKEN not set — tested, skipped publish."
