name: Scheduled ingest

# Free cron: pulls each tenant's provider/coding costs and reconciles the hook,
# running the same job as `make ingest` against the production database.
# Requires repo secrets: DATABASE_URL, ANNAPURNA_APP_DB_PASSWORD, APP_SECRET_KEY.

on:
  schedule:
    - cron: "17 6 * * *" # daily at 06:17 UTC
  workflow_dispatch: {} # also runnable on-demand from the Actions tab

jobs:
  ingest:
    name: Run cost ingest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run scheduled ingest
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANNAPURNA_APP_DB_PASSWORD: ${{ secrets.ANNAPURNA_APP_DB_PASSWORD }}
          APP_SECRET_KEY: ${{ secrets.APP_SECRET_KEY }}
        run: python -m annapurna.inference
