# Render Blueprint — one Docker web service that serves the API + the web app.
# Database is an external managed Postgres (Neon free tier). See docs/deploy.md.
#
# Secrets (set in the Render dashboard; sync:false means "I'll fill this in"):
#   DATABASE_URL              Neon connection string (the owner/admin role)
#   APP_SECRET_KEY            long random string; encrypts stored credentials — NEVER change once set
#   ANNAPURNA_APP_DB_PASSWORD a password you choose for the app's RLS-enforced DB role

services:
  - type: web
    name: annapurna
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_SECRET_KEY
        sync: false
      - key: ANNAPURNA_APP_DB_PASSWORD
        sync: false
      - key: ANNAPURNA_SECURE_COOKIES
        value: "true"
      - key: ANNAPURNA_LOG_LEVEL
        value: INFO
