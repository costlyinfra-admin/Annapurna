        fill="none" stroke="#faf9f5" stroke-width="4.4" stroke-linecap="round"/>
  <rect x="26.5" y="20" width="3.4" height="9" rx="1.7" fill="#ddf859"/>
  <rect x="31.5" y="23.5" width="3.4" height="5.5" rx="1.7" fill="#ddf859" fill-opacity="0.8"/>
